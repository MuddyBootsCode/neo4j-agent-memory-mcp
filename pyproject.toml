[project]
name = "neo4j-agent-memory-mcp"
version = "0.1.0"
description = "Standalone MCP server for Neo4j Agent Memory"
requires-python = ">=3.10"
dependencies = [
    "neo4j-agent-memory[mcp,openai]",
    "fastmcp>=2.0.0,<3",
    "baml-py>=0.70.0",
    "boto3>=1.42.88",
    "cachetools>=5.3.0",
]

[project.scripts]
neo4j-memory-mcp = "neo4j_agent_memory.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_agent_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
norecursedirs = [".*", ".venv", "node_modules", ".git", "build", "dist"]
markers = [
    "integration: requires running Neo4j instance (deselect with '-m not integration')",
    "eval: requires live LLM API keys (deselect with '-m not eval')",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pytest.PytestCollectionWarning",
]
