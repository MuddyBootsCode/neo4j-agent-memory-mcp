[project]
name = "neo4j-agent-memory-mcp"
version = "0.1.0"
description = "Standalone MCP server for Neo4j Agent Memory"
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly: agent_memory_mcp monkeypatches upstream internals
    # (MemoryClient._create_embedder, extraction.factory.create_extractor)
    # and reaches into private attributes. Any upstream bump must be
    # validated against agent_memory_mcp/mcp/_bootstrap.py before repinning.
    "neo4j-agent-memory[mcp,openai]==0.0.3",
    "fastmcp>=2.0.0,<3",
    "baml-py>=0.70.0",
    "boto3>=1.42.88",
    "cachetools>=5.3.0",
]

[project.scripts]
neo4j-memory-mcp = "agent_memory_mcp.mcp.server:main"
neo4j-memory-recall-hook = "agent_memory_mcp.hook.recall_hook:main"
nam-capture-hook = "agent_memory_mcp.hook.capture_hook:main"

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_mcp"]

[tool.ruff]
# baml_client is generated by `baml-cli generate` — lint findings there
# (unused imports, etc.) are upstream codegen artifacts, not ours to fix.
extend-exclude = ["src/agent_memory_mcp/baml_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
norecursedirs = [".*", ".venv", "node_modules", ".git", "build", "dist"]
markers = [
    "integration: requires running Neo4j instance (deselect with '-m not integration')",
    "eval: requires live LLM API keys (deselect with '-m not eval')",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pytest.PytestCollectionWarning",
]
